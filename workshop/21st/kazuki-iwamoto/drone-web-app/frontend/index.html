<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Web App</title>
  <link rel="stylesheet" href="/static/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Drone Web App</h1>
    <p id="ws-status">WebSocket: disconnected</p>
  </header>

  <main class="layout">
    <section class="panel stack">
      <div>
        <h2>Status</h2>
        <dl class="status-grid">
          <dt>Connected</dt><dd id="state-connected">false</dd>
          <dt>Armed</dt><dd id="state-armed">false</dd>
          <dt>Mode</dt><dd id="state-mode">UNKNOWN</dd>
          <dt>Latitude</dt><dd id="state-latitude">0.000000</dd>
          <dt>Longitude</dt><dd id="state-longitude">0.000000</dd>
          <dt>Altitude</dt><dd id="state-altitude">0.00 m</dd>
          <dt>Heading</dt><dd id="state-heading">0 deg</dd>
        </dl>
      </div>

      <div>
        <h2>Controls</h2>
        <div class="controls">
          <button id="connect-btn">Connect</button>
          <button id="arm-btn">Arm</button>
          <button id="disarm-btn">Disarm</button>
          <button id="land-btn">Land</button>

          <label>
            Takeoff Altitude (m)
            <input id="takeoff-altitude" type="number" min="1" step="0.5" value="10">
          </label>
          <button id="takeoff-btn">Takeoff</button>

          <label>
            GoTo Latitude
            <input id="goto-latitude" type="number" step="0.000001" value="35.681236">
          </label>
          <label>
            GoTo Longitude
            <input id="goto-longitude" type="number" step="0.000001" value="139.767125">
          </label>
          <label>
            GoTo Altitude (m)
            <input id="goto-altitude" type="number" min="0" step="0.5" value="10">
          </label>
          <button id="goto-btn">GoTo</button>

          <label>
            Flight Mode
            <select id="mode-select">
              <option value="GUIDED">GUIDED</option>
              <option value="AUTO">AUTO</option>
              <option value="RTL">RTL</option>
              <option value="LOITER">LOITER</option>
              <option value="STABILIZE">STABILIZE</option>
            </select>
          </label>
          <button id="mode-btn">Set Mode</button>
        </div>
      </div>

      <div class="log">
        <h2>Messages</h2>
        <p id="message-log">Ready.</p>
      </div>
    </section>

    <section class="map-panel">
      <div id="map"></div>
    </section>
  </main>

  <script src="/static/leaflet/leaflet.js"></script>
  <script src="/static/script.js"></script>
</body>
</html>
