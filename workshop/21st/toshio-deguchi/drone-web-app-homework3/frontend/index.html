<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドローン Web 制御アプリ（宿題3）</title>
<link rel="stylesheet" href="/static/leaflet/leaflet.css" />
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="app-header">
  <h1>ドローン Web 制御アプリ（宿題3）</h1>
  <span id="ws-indicator" class="badge badge-off">WS: 切断</span>
</header>

<main class="layout">
  <section class="panels">
    <div class="card">
      <h2>ステータス</h2>
      <table class="status-table">
        <tbody>
          <tr><th>接続状態</th><td id="stat-connected">未接続</td></tr>
          <tr><th>アーム状態</th><td id="stat-armed">ディスアーム</td></tr>
          <tr><th>フライトモード</th><td id="stat-mode">UNKNOWN</td></tr>
          <tr><th>緯度</th><td id="stat-latitude">0.000000</td></tr>
          <tr><th>経度</th><td id="stat-longitude">0.000000</td></tr>
          <tr><th>高度 (m)</th><td id="stat-altitude">0.00</td></tr>
          <tr><th>ヘディング (deg)</th><td id="stat-heading">0</td></tr>
          <tr id="row-battery"><th>バッテリー残量 (%)</th><td id="stat-battery">0</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2>コントロール</h2>

      <div class="control-row">
        <button id="btn-connect">機体へ接続</button>
      </div>

      <div class="control-row button-group">
        <button id="btn-arm">アーム</button>
        <button id="btn-disarm">ディスアーム</button>
        <button id="btn-land">着陸</button>
      </div>

      <div class="control-row">
        <label for="input-takeoff-alt">離陸高度 (m)</label>
        <div class="input-with-button">
          <input type="number" id="input-takeoff-alt" value="10" min="0" step="0.5">
          <button id="btn-takeoff">離陸</button>
        </div>
      </div>

      <div class="control-row">
        <label>GoTo（緯度・経度・高度）</label>
        <div class="goto-inputs">
          <input type="number" id="input-goto-lat" placeholder="緯度" step="0.000001" value="35.681236">
          <input type="number" id="input-goto-lon" placeholder="経度" step="0.000001" value="139.767125">
          <input type="number" id="input-goto-alt" placeholder="高度(m)" step="0.5" value="10">
        </div>
        <button id="btn-goto">GoTo実行</button>
      </div>

      <div class="control-row">
        <label for="select-mode">フライトモード変更</label>
        <div class="input-with-button">
          <select id="select-mode">
            <option value="GUIDED">GUIDED</option>
            <option value="AUTO">AUTO</option>
            <option value="RTL">RTL</option>
            <option value="LOITER">LOITER</option>
            <option value="STABILIZE">STABILIZE</option>
          </select>
          <button id="btn-set-mode">設定</button>
        </div>
      </div>

      <div class="control-row">
        <div id="log-message" class="log-message"></div>
      </div>
    </div>
  </section>

  <section class="map-section">
    <div id="map"></div>
  </section>
</main>

<script src="/static/leaflet/leaflet.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
